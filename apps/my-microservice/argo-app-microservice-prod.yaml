apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emailservice-prod
  namespace: argocd
spec:
  project: kustomize
  source:
    repoURL: https://github.com/crizstian/my-gitops-demo.git
    targetRevision: main
    path: apps/my-microservice/overlays/prod
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
