apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: dev-
resources:
  - ../../base
commonLabels:
  app: emailservice
  env: dev
patches:
  - target:
      kind: Deployment
      name: emailservice
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
images:
  - name: docker.io/nginxdemos/hello
    newTag: 0.2