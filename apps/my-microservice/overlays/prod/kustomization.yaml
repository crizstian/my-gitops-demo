apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: prod-
resources:
  - ../../base
commonLabels:
  app: emailservice
  env: prod
patches:
  - target:
      kind: Deployment
      name: emailservice
    patch: |
      - op: replace
        path: /spec/replicas
        value: 5
images:
  - name: docker.io/nginxdemos/hello
    newTag: "0.1"